{{define "content"}}
<div class="form-wrap">
    <div class="page__head">
        <div>
            <span class="eyebrow">New alias</span>
            <h1 class="page__title">Add CNAME</h1>
        </div>
    </div>

    <form id="editHostForm" class="card" action="javascript:void(0);">
        <div class="field">
            <label for="hostname">Alias hostname</label>
            <div class="input-group">
                <input type="text" class="control mono-input" id="hostname" name="hostname" placeholder="e.g. www">
                <input type="text" class="control mono-input" id="domain_mirror" placeholder="target domain" readonly>
            </div>
            <div class="hint">The new name that will point to an existing host.</div>
        </div>

        <div class="field">
            <label for="target_id">Target host</label>
            <select class="control" name="target_id" id="target_id">
                <option value="" selected>Choose target…</option>
                {{range $host := .hosts}}
                <option value="{{$host.ID}}" data-domain=".{{$host.Domain}}">{{$host.Hostname}}.{{$host.Domain}}</option>
                {{end}}
            </select>
        </div>

        <div class="field">
            <label for="ttl">TTL</label>
            <select class="control" id="ttl" name="ttl">
                <option value="20" {{if .cname.Ttl}}{{if eq .cname.Ttl 20}}selected{{end}}{{end}}>20 s — super dynamic, frequent updates</option>
                <option value="60" {{if .cname.Ttl}}{{if eq .cname.Ttl 60}}selected{{end}}{{end}}>60 s — default dynamic DNS value</option>
                <option value="3600" {{if .cname.Ttl}}{{if eq .cname.Ttl 3600}}selected{{end}}{{end}}>1 hr — rarely updated address</option>
                <option value="14400" {{if .cname.Ttl}}{{if eq .cname.Ttl 14400}}selected{{end}}{{end}}>4 hrs — static, benefits from caching</option>
            </select>
        </div>

        <div class="form-actions">
            <a class="btn btn--ghost" href="/admin/cnames">Cancel</a>
            <button class="js-submit btn btn--primary" type="submit" data-type="cnames" data-action="add" data-id="{{.cname.ID}}">
                Add CNAME
            </button>
        </div>
    </form>
</div>
{{end}}
